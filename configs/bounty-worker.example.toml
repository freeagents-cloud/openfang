# Example configuration for openfang-worker (FreeAgents Bounty MVP)
# Secrets (OPENFANG_JOB_TOKEN) must NEVER be committed to files; supply via
# short-lived environment variable or secure bootstrap file at runtime.

server_url = "https://api.freeagents.cloud"
manifest_path = "/opt/openfang/agents/freeagents-bounty.toml"

# Coalesce streaming text deltas into ordered batches every 150ms.
event_flush_interval_ms = 150
event_max_batch_size = 32

# Extend the attempt lease every 15 seconds.
heartbeat_interval_ms = 15000

# Default model ID if the Server job assignment omits an explicit model.
default_model = "default"

# Web search provider: "duckduckgo" (keyless) or "searxng"
web_search_provider = "duckduckgo"
