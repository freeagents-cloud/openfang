name: Bounty Worker CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check-and-test:
    name: Build, Clippy & Bounty Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check bounty crates
        run: cargo check -p openfang-bittensor -p openfang-worker --tests

      - name: Clippy on bounty crates
        run: cargo clippy -p openfang-bittensor -p openfang-worker --tests -- -D warnings

      - name: Run bounty unit and integration tests
        run: cargo test -p openfang-bittensor -p openfang-worker

  build-worker-oci:
    name: Build Linux x86_64 Worker OCI Image
    runs-on: ubuntu-latest
    needs: rust-check-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build worker OCI image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          platforms: linux/amd64
          push: false
          load: true
          tags: freeagents/openfang-worker:${{ github.sha }}
          build-args: |
            LTO=false
            CODEGEN_UNITS=16
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify worker binary entrypoint
        run: docker run --rm freeagents/openfang-worker:${{ github.sha }} --help
